# Local development services for 611 Ministry Funding.
#
#   docker compose up -d      # start Postgres + Redis in the background
#   docker compose down       # stop them (data is kept in named volumes)
#   docker compose down -v     # stop AND wipe the data volumes
#
# The app itself runs on the host with `bun run dev` — this file only provides
# the backing services. The Postgres credentials/DB name match .env.example.

services:
  db:
    image: postgres:18
    container_name: ministry-funding-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: petty_cash
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d petty_cash"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ministry-funding-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
